[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameaihack"
version = "0.2.0"
description = "APK 游戏解剖包：体检、指纹、可交接报告"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pyyaml>=6",
  "jinja2>=3",
  "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
manifest = ["pyaxmlparser>=0.3.31"]
unity = ["UnityPy>=1.10", "Pillow>=10"]
dsh = ["deepseek-harness-sdk"]

[project.scripts]
gameaihack = "gameaihack.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gameaihack = ["templates/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

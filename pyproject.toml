[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameaihack"
version = "0.2.0"
description = "提取游戏策划与美术，用 TapTap Maker 做成玩法一模一样的新游戏"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "pyyaml>=6",
  "jinja2>=3",
  "jsonschema>=4",
  "pyaxmlparser>=0.3.31",
  "UnityPy>=1.10",
  "Pillow>=10",
  "frida-tools>=12",
  "gplaydl>=4",
]

[project.optional-dependencies]
manifest = ["pyaxmlparser>=0.3.31"]
unity = ["UnityPy>=1.10", "Pillow>=10"]
deep = ["frida-tools>=12"]
fetch = ["gplaydl>=4"]
dsh = ["deepseek-harness-sdk>=0.1.1rc1"]

[project.scripts]
gameaihack = "gameaihack.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gameaihack = ["templates/*", "data/*"]
